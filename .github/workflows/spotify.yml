name: spotify-librespot
on:
  push:
    paths: [ "tools/spotify/**", ".github/workflows/spotify.yml" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false
      - uses: actions/cache@v4
        id: cache
        with:
          path: app/src/main/jniLibs/armeabi-v7a/libgolibrespot.so
          key: golibrespot-${{ hashFiles('tools/spotify/build.sh') }}
      - name: Compiler go-librespot pour Android
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/spotify/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libgolibrespot
          path: app/src/main/jniLibs/armeabi-v7a/libgolibrespot.so
